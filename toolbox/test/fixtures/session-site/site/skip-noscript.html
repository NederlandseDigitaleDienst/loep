<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><title>Skiplink zonder doel - Testsite sessie</title></head>
<body>
<button id="skip" type="button">Sla over</button>
<noscript><p>Deze site werkt beter met JavaScript.</p></noscript>
<nav aria-label="Hoofdmenu"><a href="/">Start</a></nav>
<main><h1>Skiplink zonder doel</h1><p><a href="/form.html">Naar het formulier</a></p></main>
<script>
  // A component that moves focus to whatever follows it in the code.
  document.getElementById("skip").addEventListener("click", (event) => event.currentTarget.nextElementSibling?.focus());
</script>
</body>
</html>
