<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>t</title><style>.r{opacity:0}.r.in{opacity:1}section{height:900px}</style></head><body>
<section><h1>Boven</h1></section><section><p class="r" id="late">Verschijnt bij scrollen</p></section><section><p>Einde</p></section>
<script>const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}));document.querySelectorAll('.r').forEach(e=>o.observe(e));</script></body></html>
