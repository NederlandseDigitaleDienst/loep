<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><title>Schaal met vakken - Testsite sessie</title>
<style>
body { font-family: Arial, Helvetica, sans-serif; margin: 32px; background: #ffffff; color: #333333; }
form { background: #e6e6e6; padding: 24px; }
fieldset { border: 0; margin: 0; padding: 0; }
.options { display: flex; gap: 12px; }
/* The glow of the chosen box is cut off at the box. */
.options > div { overflow: hidden; }
/* The input is clipped to one pixel; the label draws the box. */
.visually-hidden { position: absolute !important; overflow: hidden; clip: rect(1px, 1px, 1px, 1px); width: 1px; height: 1px; word-wrap: normal; }
.options label { display: block; width: 140px; padding: 2px 0; text-align: center; font-size: 19px; background: #ffffff; color: #666666; border: 2px solid #cccccc; border-radius: 4px; }
.options input:focus + label { border-color: #999999; }
.options input:checked + label { border-color: #0074bd; box-shadow: 0 0 5px #0074bd; color: #000000; }
</style></head>
<body>
<main><h1>Hoe tevreden bent u?</h1>
<form action="/" method="get" onsubmit="return false">
<fieldset><legend>Op een schaal van 1 tot 3</legend>
<div class="options">
<div><input class="visually-hidden" type="radio" name="score" id="score-1" value="1"><label for="score-1" id="label-1">1</label></div>
<div><input class="visually-hidden" type="radio" name="score" id="score-2" value="2"><label for="score-2" id="label-2">2</label></div>
<div><input class="visually-hidden" type="radio" name="score" id="score-3" value="3"><label for="score-3" id="label-3">3</label></div>
</div>
</fieldset>
</form>
</main>
</body>
</html>
