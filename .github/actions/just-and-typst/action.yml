name: just en typst
description: >
  Installeert just, en met `typst: true` ook typst, in een vaste versie, rechtstreeks uit de
  release en gecontroleerd tegen de sha256 hieronder. De acties setup-just en setup-typst vragen
  eerst de lijst van releases op bij de API van GitHub; op 22 oktober 2026 kwam die lijst leeg terug
  en faalden daardoor willekeurige jobs in de merge queue (#320). Een nieuwere versie: pas de versie
  en de sha256 hier aan.
inputs:
  typst:
    description: Installeer ook typst.
    default: "false"
runs:
  using: composite
  steps:
    - name: just en typst
      shell: bash
      env:
        JUST_VERSION: 1.59.0
        JUST_SHA256: 409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e
        TYPST_VERSION: 0.15.1
        TYPST_SHA256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
        WITH_TYPST: ${{ inputs.typst }}
      run: |
        set -eu
        bin="$RUNNER_TEMP/bin"
        work="$(mktemp -d)"
        mkdir -p "$bin"
        fetch() { curl -sSfL --retry 5 --retry-all-errors -o "$work/$2" "$1" && echo "$3  $work/$2" | sha256sum -c -; }
        fetch "https://github.com/casey/just/releases/download/$JUST_VERSION/just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz" just.tar.gz "$JUST_SHA256"
        tar -xzf "$work/just.tar.gz" -C "$bin" just
        if [ "$WITH_TYPST" = true ]; then
          fetch "https://github.com/typst/typst/releases/download/v$TYPST_VERSION/typst-x86_64-unknown-linux-musl.tar.xz" typst.tar.xz "$TYPST_SHA256"
          tar -xJf "$work/typst.tar.xz" -C "$bin" --strip-components=1 typst-x86_64-unknown-linux-musl/typst
        fi
        echo "$bin" >> "$GITHUB_PATH"
