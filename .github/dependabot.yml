# Voorstellen voor nieuwe versies, één keer per week. De controle draait op elk voorstel.
# Een nieuwe versie van een regel-engine (axe-core, Alfa, QualWeb, de IBM-checker) kan
# uitkomsten veranderen zonder dat een test faalt: neem zo'n voorstel pas over na een kleine
# meting op de testsite.
version: 2
updates:
  - package-ecosystem: npm
    directory: /toolbox
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      regel-engines:
        patterns:
          - "axe-core"
          - "@siteimprove/*"
          - "@qualweb/*"
          - "accessibility-checker*"
      overig:
        patterns:
          - "*"
        exclude-patterns:
          - "axe-core"
          - "@siteimprove/*"
          - "@qualweb/*"
          - "accessibility-checker*"
    ignore:
      # De types volgen de laagste Node die de toolbox ondersteunt (22.18, zie de README).
      # Met types van een nieuwere Node compileert code die op 22 niet draait.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Playwright 1.64 laat in Chromium een klik eindeloos wachten op een navigatie die
      # met 204 No Content is tegengehouden; zo houdt de toolbox navigaties tegen.
      # microsoft/playwright#43279 is gesloten, maar 1.64.1 heeft het nog. Haal dit weg
      # zodra een versie de tests van session.test.ts en writes.test.ts haalt.
      - dependency-name: "playwright"
        versions: ["1.64.x"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Eén voorstel voor alle acties: elk voorstel draait de volledige controle van 25 minuten.
    groups:
      acties:
        patterns:
          - "*"
