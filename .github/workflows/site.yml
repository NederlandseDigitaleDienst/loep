name: Site

# Publishes site/ on GitHub Pages as it is, and on Toon (nldd/loep) with the
# fonts and icons embedded, because Toon refuses those from a CDN.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml", ".github/scripts/site-toon.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5

  toon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/site-toon.py site toon-dist
      - uses: DigiGilde/toon/actions/publish@3c0427f19f9ea7e367d9f6574e74d51fd789d0d7
        with:
          site: nldd/loep
          site-id: ee7f5a1c-62d6-4fe5-a3db-58d0aea5c6de
          dist-path: toon-dist
