# Twee controles. De snelle draait bij elke push naar main en op elk voorstel, en kost een paar
# minuten: licenties, types, procedures en de tests die geen browser nodig hebben.
#
# De volledige doet wat een nieuwe gebruiker doet: installeren op een schone machine, zeggen
# wat er staat, alle tests. Ze draait in de merge queue, één keer per nacht als er die dag iets
# is veranderd, en met de hand. Een nacht zonder wijziging draait niets. Op een voorstel draait
# ze niet: de job `volledig` slaagt daar meteen, zodat een voorstel direct de queue in kan, en
# de queue test het samen met main en de voorstellen ervoor. Zo draaien de zware tests één keer
# per voorstel in plaats van twee keer. Wat in de queue faalt, gaat terug naar het voorstel.
# Ze bestaat uit losse jobs die naast elkaar lopen:
#
# - wijziging: zegt of er iets te controleren is (alleen 's nachts kan het antwoord nee zijn),
#   en wat het voorstel raakt: de veegronde en de ijkmeting draaien alleen als het ertoe doet.
# - installatie: REUSE, `just install` en `just tools` op een schone machine (zonder cache
#   voor de browsers), `just doctor`, de types en de procedures.
# - tests (1/4) tot en met (4/4): elk een deel van de testbestanden, verdeeld op gemeten duur
#   (`just test-shard <i> <n>`, met toolbox/test/durations.json). Het langste bestand,
#   atonce-sweep.test.ts met ruim 9 minuten, bepaalt hoe kort een job kan zijn. Meer of minder
#   delen: pas `shard` en `total` aan. In deze jobs staat veraPDF (een vaste versie,
#   toolbox/scripts/install-verapdf.sh): de tests die het nodig hebben, falen met CI=true als
#   het ontbreekt, in plaats van stil terug te vallen.
# - tests zonder browser (Node 22.18): de types en `just test-quick` op de laagste versie van
#   Node die toolbox/package.json belooft. De volledige tests draaien op Node 24.
# - veegronde op de testsite: als een voorstel toolbox/src/ raakt, of de pakketten, de testsite
#   (toolbox/fixtures/) of de toets zelf (en elke nacht en met de hand),
#   de regressietoets `just sweep-check`: inventory, een vast sitemodel, collect, contrast en
#   states op de testsite, en per gebrek uit de sleutel of het bewijs in het dossier staat. Twee
#   jobs naast elkaar: Lindewaard (de gebreken) en Berkenveen (de tweeling). De tabel komt als
#   artefact mee. Raakt het voorstel niets daarvan, dan slaagt de job meteen.
# - ijkmeting: raakt het voorstel de contrastmeting, toolbox/src/lib/, de pakketten of deze
#   workflow, dan draait `just calibrate` en komt de uitkomst naast de vorige uit
#   validatie/ijkset/. Een eigen job naast de veegronde, niet erna: samen duurden ze 18 tot 23
#   minuten.
# - volledig: wacht op de andere en faalt als er een mislukte, werd afgebroken of werd
#   overgeslagen. Dit is de verplichte check op main en in de merge queue; hernoem deze job
#   niet, anders blokkeren de branch-protectie en de ruleset van de merge queue.
#
# Wat elke job inricht, komt zoveel mogelijk uit een cache: de pakketten van npm (setup-node),
# de browsers van Playwright en de pakketten van Ubuntu die apt binnenhaalt (zie
# .github/actions/). Een cache die de queue maakt, ziet alleen die ene run; de nachtelijke run op
# main maakt de cache die de queue leest.
#
# De veegronde van Lindewaard bepaalt de duur: ongeveer 14 minuten. Zonder de veegronde duurt
# alles samen ongeveer 11 minuten.
name: Controle

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests a pull request together with main and the ones queued before it.
  merge_group:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controle-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snel:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: toolbox/package-lock.json
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
      - name: Elk bestand heeft een rechthebbende en een licentie
        run: just reuse
      - name: Pakketten, zonder browsers
        run: cd toolbox && npm ci
      - name: Types
        run: just check
      - name: Procedures
        run: just procedures
      - name: Tests zonder browser
        run: just test-quick

  wijziging:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ja: ${{ steps.nieuw.outputs.ja }}
      src: ${{ steps.geraakt.outputs.src }}
      ijk: ${{ steps.geraakt.outputs.ijk }}
    steps:
      # A pull request needs no history: it skips the full check.
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 0

      - name: Is er vandaag iets veranderd
        id: nieuw
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # A pull request skips the full check: the merge queue runs it on the merge group.
          if [ "$EVENT" = "pull_request" ]; then echo "ja=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" != "schedule" ] || [ -n "$(git log --since='25 hours ago' --format=%h -1)" ]; then echo "ja=true" >> "$GITHUB_OUTPUT"; else echo "ja=false" >> "$GITHUB_OUTPUT"; fi

      # The merge queue is compared with its base; the nightly run and a run by hand always measure.
      - name: Wat is er geraakt
        id: geraakt
        if: steps.nieuw.outputs.ja == 'true'
        env:
          EVENT: ${{ github.event_name }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT" = merge_group ]; then
            changed="$(git diff --name-only "$QUEUE_BASE" HEAD)"
          else
            changed="toolbox/src/lib/"
          fi
          # The code of the sweep, the versions of the rule engines, the fixture site with its key, and the check itself.
          # A change to this workflow or its actions runs both, so that every part of it has run once before it lands.
          if echo "$changed" | grep -Eq '^(toolbox/src/|toolbox/package-lock\.json|toolbox/fixtures/|toolbox/scripts/sweep-check\.ts|\.github/workflows/controle\.yml|\.github/actions/)'; then echo "src=true" >> "$GITHUB_OUTPUT"; else echo "src=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$changed" | grep -Eq '^(toolbox/src/(lib/|instruments/contrast\.ts|commands/contrast\.ts|commands/calibrate\.ts)|toolbox/package-lock\.json|toolbox/scripts/calibrate-compare\.ts|\.github/workflows/controle\.yml|\.github/actions/)'; then echo "ijk=true" >> "$GITHUB_OUTPUT"; else echo "ijk=false" >> "$GITHUB_OUTPUT"; fi

  installatie:
    needs: wijziging
    if: needs.wijziging.outputs.ja == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: toolbox/package-lock.json
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
      - uses: typst-community/setup-typst@v5
      # Only the downloads of apt; what it installs, and the browsers, are as on a clean machine.
      - uses: ./.github/actions/ubuntu-packages

      - name: Elk bestand heeft een rechthebbende en een licentie
        run: just reuse

      - name: Pakketten en browsers
        run: just install

      - name: Hulpprogramma's
        run: just tools

      - name: Wat staat er op deze machine
        run: just doctor

      - name: Types
        run: just check

      - name: Procedures
        run: just procedures

  tests:
    needs: wijziging
    if: needs.wijziging.outputs.ja == 'true'
    name: tests (${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Let every shard finish, so a failure shows all tests that fail, not only the first shard's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: toolbox/package-lock.json
      - uses: extractions/setup-just@v4
      # release.test.ts runs towncrier with uvx.
      - uses: astral-sh/setup-uv@v7
      - uses: typst-community/setup-typst@v5

      - name: Pakketten
        run: cd toolbox && npm ci

      - uses: ./.github/actions/browsers-and-tools

      # No package source has veraPDF; the tests that need it fail with CI=true when it is missing.
      - name: veraPDF
        run: sudo sh toolbox/scripts/install-verapdf.sh

      - name: Tests
        run: just test-shard ${{ matrix.shard }} ${{ matrix.total }}

  node-22:
    needs: wijziging
    if: needs.wijziging.outputs.ja == 'true'
    name: tests zonder browser (Node 22.18)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: toolbox/package-lock.json
      - uses: extractions/setup-just@v4
      # release.test.ts runs towncrier with uvx.
      - uses: astral-sh/setup-uv@v7
      - name: Pakketten, zonder browsers
        run: cd toolbox && npm ci
      - name: Types
        run: just check
      - name: Tests zonder browser
        run: just test-quick

  veegronde:
    needs: wijziging
    if: needs.wijziging.outputs.ja == 'true'
    name: veegronde op de testsite (${{ matrix.site }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # The two variants on two machines at the same time: each takes about as long as the other.
      matrix:
        include:
          - variant: defect
            site: Lindewaard
          - variant: clean
            site: Berkenveen
    env:
      MEASURE: ${{ needs.wijziging.outputs.src }}
    steps:
      - name: Niets te meten
        if: env.MEASURE != 'true'
        run: echo "Dit voorstel raakt de code van de veegronde, de pakketten, de testsite en de toets niet; de veegronde is niet opnieuw gemeten."

      - uses: actions/checkout@v7
        if: env.MEASURE == 'true'
      - uses: actions/setup-node@v7
        if: env.MEASURE == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: toolbox/package-lock.json
      - uses: extractions/setup-just@v4
        if: env.MEASURE == 'true'

      - name: Pakketten
        if: env.MEASURE == 'true'
        run: cd toolbox && npm ci

      # Text recognition and the other tools change what collect writes; the baseline was made with them.
      - uses: ./.github/actions/browsers-and-tools
        if: env.MEASURE == 'true'

      - name: Regressietoets van de veegronde
        if: env.MEASURE == 'true'
        run: just sweep-check --variant ${{ matrix.variant }} --out "$RUNNER_TEMP/veegronde" --at-once 3

      - name: Tabel in de samenvatting
        if: always() && env.MEASURE == 'true'
        run: if [ -f "$RUNNER_TEMP/veegronde/sweep-check.md" ]; then cat "$RUNNER_TEMP/veegronde/sweep-check.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Tabel als artefact
        if: always() && env.MEASURE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: veegronde-${{ matrix.site }}
          path: |
            ${{ runner.temp }}/veegronde/sweep-check.md
            ${{ runner.temp }}/veegronde/sweep-check.json
          if-no-files-found: warn

  ijkmeting:
    needs: wijziging
    if: needs.wijziging.outputs.ja == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MEASURE: ${{ needs.wijziging.outputs.ijk }}
    steps:
      - name: Niets te ijken
        if: env.MEASURE != 'true'
        run: echo "Dit voorstel raakt de contrastmeting, toolbox/src/lib/ en de pakketten niet; de ijkmeting is niet opnieuw gedaan."

      - uses: actions/checkout@v7
        if: env.MEASURE == 'true'
      - uses: actions/setup-node@v7
        if: env.MEASURE == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: toolbox/package-lock.json
      - uses: extractions/setup-just@v4
        if: env.MEASURE == 'true'

      - name: Pakketten
        if: env.MEASURE == 'true'
        run: cd toolbox && npm ci

      - uses: ./.github/actions/browsers-and-tools
        if: env.MEASURE == 'true'

      # The test cases of the ACT rules, about 90 MB, are fetched once per commit of their repository.
      - name: Testgevallen van de ACT-regels uit de cache
        if: env.MEASURE == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/loep/act-rules
          key: act-rules-${{ hashFiles('toolbox/src/commands/calibrate.ts') }}

      - name: IJkmeting naast de vorige
        if: env.MEASURE == 'true'
        run: |
          just calibrate --out "$RUNNER_TEMP/ijkset"
          previous="$(ls -d validatie/ijkset/20*/ | sort | tail -1)"
          node toolbox/scripts/calibrate-compare.ts "$previous" "$RUNNER_TEMP/ijkset" > "$RUNNER_TEMP/ijkset/verschil.md"
          cat "$RUNNER_TEMP/ijkset/verschil.md" >> "$GITHUB_STEP_SUMMARY"

      - name: IJkmeting als artefact
        if: always() && env.MEASURE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ijkset
          path: ${{ runner.temp }}/ijkset/
          if-no-files-found: warn

  volledig:
    needs: [wijziging, installatie, tests, node-22, veegronde, ijkmeting]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Zijn alle delen geslaagd
        env:
          WIJZIGING: ${{ needs.wijziging.result }}
          NIEUW: ${{ needs.wijziging.outputs.ja }}
          INSTALLATIE: ${{ needs.installatie.result }}
          TESTS: ${{ needs.tests.result }}
          NODE22: ${{ needs.node-22.result }}
          VEEGRONDE: ${{ needs.veegronde.result }}
          IJKMETING: ${{ needs.ijkmeting.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "wijziging: $WIJZIGING, installatie: $INSTALLATIE, tests: $TESTS, node 22: $NODE22, veegronde: $VEEGRONDE, ijkmeting: $IJKMETING"
          if [ "$WIJZIGING" = success ] && [ "$NIEUW" != true ] && [ "$EVENT" = pull_request ]; then
            echo "Op een voorstel draait alleen de snelle controle; de volledige draait in de merge queue."
            exit 0
          fi
          if [ "$WIJZIGING" = success ] && [ "$NIEUW" != true ]; then
            echo "Vandaag is er niets veranderd; er is niets gecontroleerd."
            exit 0
          fi
          if [ "$WIJZIGING" = success ] && [ "$INSTALLATIE" = success ] && [ "$TESTS" = success ] && [ "$NODE22" = success ] && [ "$VEEGRONDE" = success ] && [ "$IJKMETING" = success ]; then
            exit 0
          fi
          echo "::error::Een deel van de volledige controle is mislukt, afgebroken of overgeslagen."
          exit 1
